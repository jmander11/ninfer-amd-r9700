name: ninfer-amd

services:
  server:
    image: local/ninfer-r9700:compose
    pull_policy: build
    build:
      context: .
      target: runtime
      args:
        NINFER_BUILD_JOBS: ${NINFER_BUILD_JOBS:-8}
      additional_contexts:
        rocm: ${NINFER_ROCM_CONTEXT:-/opt/rocm/core-10.0}
        python311: ${NINFER_PYTHON_CONTEXT:?Set the self-contained Python 3.11 root in .env}
    environment:
      DEBUG_HIP_GRAPH_CLASSIC_PATH: "0"
      ROC_ENABLE_LARGE_BAR: "0"
      ROC_SKIP_KERNEL_ARG_COPY: "0"
      HSA_DISABLE_FRAGMENT_ALLOCATOR: "1"
      DEBUG_HIP_GRAPH_BATCH_SIZE: "16384"
    devices:
      - /dev/kfd:/dev/kfd
      - ${NINFER_DRM_RENDER_NODE:-/dev/dri/renderD128}:${NINFER_DRM_RENDER_NODE:-/dev/dri/renderD128}
    expose:
      - "8080"
    networks:
      proxy:
        aliases:
          - ninfer-r9700
    volumes:
      - type: bind
        source: ${NINFER_MODELS_DIR:-../models}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NINFER_DISK_CACHE_DIR:-./.cache/ninfer}
        target: /cache
        bind:
          create_host_path: false
    shm_size: 1gb
    mem_limit: 24g
    memswap_limit: 24g
    ulimits:
      memlock: {soft: -1, hard: -1}
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    command:
      - ninfer-serve
      - /models/${NINFER_MODEL:-qwen3.8-27b-r9700-lq4/qwen3.8-27b-r9700-lq4.ninfer}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --temperature
      - "1.5"
      - --max-context
      - "262144"
      - --max-concurrency
      - "${NINFER_CONCURRENCY:-6}"
      - --prefill-chunk
      - "2048"
      - --kv-capacity
      - auto
      - --kv-ram-capacity
      - "${NINFER_RAM_CACHE_MIB:-12288}"
      - --kv-ram-system-prompts
      - "${NINFER_SYSTEM_PROMPTS:-0}"
      - --kv-disk-capacity
      - "${NINFER_DISK_CACHE_MIB:-25600}"
      - --kv-disk-location
      - /cache/prefix
      - --spec
      - dflash
      - --draft-tokens
      - "${NINFER_DRAFT_TOKENS:-7}"
      - --adaptive-draft
      - --lm-head-draft
      - --pending-timeout-ms
      - "900000"
      - --default-reasoning-effort
      - "${NINFER_DEFAULT_REASONING_EFFORT:-low}"
      - --default-thinking-token-budget
      - "${NINFER_DEFAULT_THINKING_TOKEN_BUDGET:-off}"
      - --default-max-tokens
      - "32768"
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      start_period: 3m
      retries: 4

networks:
  proxy:
    external: true
