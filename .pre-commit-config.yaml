# Pinned formatters, linters, and file checks. Every tool version lives here except clang-tidy,
# which needs the HIP build tree and is the selected ROCm toolchain's (scripts/run-clang-tidy.py).
#
# The commit hook (.githooks/pre-commit) runs these on staged files, folds the automatic fixes
# into the commit, and fails only when a check still fails. Enable it once per checkout:
#
#   git config core.hooksPath .githooks
#   pre-commit run --all-files                           # every commit-stage hook, whole tree
#   pre-commit run clang-tidy-changed --hook-stage manual
#   pre-commit run clang-tidy-full --hook-stage manual   # whole-tree clang-tidy
# Policy and rationale: docs/maintainer/code-quality.md.
minimum_pre_commit_version: "4.0.0"
# Recorded evidence under profiles/ is raw tool output and stays byte-exact.
exclude: ^(third_party|profiles)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: &data \.patch$|(^|/)fixtures/|^examples/cli/messages/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *data
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: *data

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        # identify has no HIP tag, so C, C++, and HIP sources are selected by extension.
        types_or: [text]
        files: \.(c|cc|cpp|h|hpp|hip)$
        # Candidate qualifiers whose source text tools/r9700 static checkers pin byte for byte.
        exclude: ^tools/r9700/(a8g128_q4g128_n16k16_(harness|qual)|a8q4_dflash_small_t_qual|a8q4_group_major_activation_(harness|qual)|a8q4_n16k16_layout_(harness|qual)|a8q4_shape_sweep_qual|split512_attention_qual|w8a8_wmma_linear_qual|xattention_prefill_qual)\.(hip|h)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.3
    hooks:
      - id: typos
        args: [--force-exclude]

  - repo: local
    hooks:
      # clang-tidy needs a configured build-r9700 tree, so it is not part of the commit hook.
      - id: clang-tidy-changed
        name: clang-tidy (lines changed vs. origin/HEAD, ROCm LLVM)
        entry: scripts/run-clang-tidy.py --changed
        language: system
        pass_filenames: false
        stages: [manual]
      - id: clang-tidy-full
        name: clang-tidy (whole tree, ROCm LLVM)
        entry: scripts/run-clang-tidy.py
        language: system
        pass_filenames: false
        stages: [manual]
