name: Host checks

on:
  push:
    branches: [master, experimental]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install check runner
        run: python -m pip install pre-commit==4.3.0
      - name: Formatting and file hygiene
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Benchmark and serving-report contracts (CPU only)
        run: |
          python -m unittest discover -s tests -p 'test_bench_matrix.py' -v
          python -m unittest discover -s tests -p 'test_serve_corpus.py' -v
      - name: Compose configurations
        env:
          NINFER_PYTHON_CONTEXT: /tmp/python311
          NINFER_ROCM_CONTEXT: /tmp/rocm
          NINFER_MODELS_DIR: /tmp/models
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.local.yaml config --quiet
